name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run daily at 12:00 UTC (20:00 Beijing time)
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Excavate
        uses: ScoopInstaller/GithubActions@v3
        env:
          SKIP_UPDATED: 1
